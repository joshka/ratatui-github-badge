[package]
name = "ratatui-badge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-rp = { version = "0.10.0", features = ["rp235xb", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "executor-thread"] }
embassy-time = "0.5.1"
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embedded-alloc = "0.7.0"
embedded-graphics = "0.8.2"
mousefood = { path = "../mousefood/mousefood", default-features = false, features = ["fonts"] }
ratatui = { version = "0.30.2", default-features = false }

critical-section = "1.2.0"
badge-ui = { path = "ui" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"


[workspace]
members = ["ui"]

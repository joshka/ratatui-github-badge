[package]
name = "ratatui-badge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-rp = { version = "0.10.0", features = ["rp235xb", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "executor-thread"] }
embassy-time = "0.5.1"
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embedded-alloc = "0.7.0"
embedded-graphics = "0.8.2"
mousefood = { version = "0.5.2", default-features = false, features = ["fonts"] }
ratatui = { version = "0.30.2", default-features = false }

cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "proto-ipv4", "medium-ethernet"] }
static_cell = "2.1.1"
critical-section = "1.2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"

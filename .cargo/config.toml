[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# -f asks running badge firmware to reboot into BOOTSEL over USB (fallback: hold Left + Select).
runner = "picotool load -u -v -x -f -t elf"

[build]
target = "thumbv8m.main-none-eabihf"

[alias]
# Host-side tools; --target overrides the default thumbv8m target above.
badge = "run --quiet --release --manifest-path host/Cargo.toml --target host-tuple --"
preview = "run --quiet --package badge-ui --example preview --target host-tuple --"
test-ui = "test --package badge-ui --target host-tuple"

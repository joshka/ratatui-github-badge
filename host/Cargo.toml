[package]
name = "badge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Talk to the Ratatui Universe badge over USB, Bluetooth LE or the relay: live mirror, logs, remote keys"

[workspace]

[dependencies]
ansi-to-tui = "8.0.1"
base64 = "0.23.1"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
futures = "0.3.34"
getrandom = "0.3"
hmac = "0.12"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
ratatui = "0.30.2"
serialport = "4.10.1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
toml = "1.1.8"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = "1.29.0"

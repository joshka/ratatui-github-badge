# Your details for the badge. Copy this to badge.toml (gitignored) and edit it, or point
# BADGE_CONFIG at a file anywhere. Rebuild and flash to apply: `cargo run --release`.

name = "Ferris the Crab"
handle = "@ferris"
role = "rustacean"

# Shown under your name; Up/Down on the first page cycles through them.
moods = [
    "Ask me about Ratatui",
    "Let's build a TUI",
    "Open to chat",
]

# Optional PNG or JPEG of any size, center-cropped to a square. Relative paths are relative to
# this file; `~/` works too. Without one, the badge shows no photo.
# avatar = "private/avatar.png"

# The "me" page cycles through these QR codes. `qr` is any text: a URL, or a vCard so
# phones offer to save you as a contact.
[[contacts]]
label = "Save contact"
qr = """
BEGIN:VCARD\r
VERSION:3.0\r
N:Crab;Ferris;;;\r
FN:Ferris the Crab\r
URL:https://ratatui.rs\r
END:VCARD\r
"""

[[contacts]]
label = "ratatui.rs"
qr = "https://ratatui.rs"

# Ambient mode: after `idle_seconds` without input the badge cycles full-screen scenes in a
# random order, `scene_seconds` each. Weights set how often each scene comes up; 0 hides it.
[ambient]
idle_seconds = 30
scene_seconds = 8
weights = { fire = 1, plasma = 1, rain = 3, warp = 1 }

# Networks the badge may join, tried in order. Omit `password` for an open network. Without
# any `[[wifi]]` entries this defaults to the GitHub Universe attendee network below (its
# password is shared with everyone at the event); `wifi = []` before any tables opts out.
[[wifi]]
ssid = "GitHub Events"
password = "HelloWorld"

# Bluetooth LE: the badge advertises a Nordic UART Service, so `cargo badge --ble` (or a phone
# app such as nRF Connect) can mirror and drive it. On by default.
# `name` (at most 29 bytes) is what `cargo badge --ble` looks for. With a `key`, the badge and
# the host prove to each other that they both know it before the badge takes commands or sends
# anything; without one, anyone nearby can drive the badge. Make one with `openssl rand -hex 32`.
# [ble]
# enabled = true
# name = "Ratatui badge"
# key = "a long random string"

# Optional relay for mirroring over the internet (see relay/README.md). The badge joins one of
# the [[wifi]] networks and connects out to `url`; `cargo badge --relay` connects to the same
# url. Each path is its own room. `token` must match the relay's RELAY_TOKEN secret.
# [relay]
# url = "wss://badge-relay.example.workers.dev/badge/ferris"
# token = "a long random string"

# Your details for the badge. Copy this to badge.toml (gitignored) and edit it, or point
# BADGE_CONFIG at a file anywhere. Rebuild and flash to apply: `cargo run --release`.

name = "Ferris the Crab"
handle = "@ferris"
role = "rustacean"

# Shown under your name; Up/Down on the first page cycles through them.
moods = [
    "Ask me about Ratatui",
    "Let's build a TUI",
    "Open to chat",
]

# Optional PNG or JPEG of any size, center-cropped to a square. Relative paths are relative to
# this file; `~/` works too. Without one, the badge shows no photo.
# avatar = "private/avatar.png"

# The "me" page cycles through these QR codes. `qr` is any text: a URL, or a vCard so
# phones offer to save you as a contact.
[[contacts]]
label = "Save contact"
qr = """
BEGIN:VCARD\r
VERSION:3.0\r
N:Crab;Ferris;;;\r
FN:Ferris the Crab\r
URL:https://ratatui.rs\r
END:VCARD\r
"""

[[contacts]]
label = "ratatui.rs"
qr = "https://ratatui.rs"

# Ambient mode: after `idle_seconds` without input the badge cycles full-screen scenes in a
# random order, `scene_seconds` each. Weights set how often each scene comes up; 0 hides it.
[ambient]
idle_seconds = 30
scene_seconds = 8
weights = { fire = 1, plasma = 1, rain = 3, warp = 1 }
